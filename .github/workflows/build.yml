# Plano B do deploy: se o build no Portainer estourar a memoria da VPS
# (6,4 GB para 40 containers), a imagem e construida aqui e publicada no GHCR.
# Para usar: troque o bloco `build:` do docker-compose.yml por
#   image: ghcr.io/${{ github.repository_owner }}/capi-console:latest
# e no Portainer use "Pull and redeploy".
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  imagem:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/capi-console:latest
            ghcr.io/${{ github.repository_owner }}/capi-console:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
